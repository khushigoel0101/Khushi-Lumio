services:
  mongo:
    image: mongo:7
    container_name: summarizer-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/config/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/notes_db
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
